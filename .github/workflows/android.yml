name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: App icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#04050b" --splashBackgroundColor "#04050b"
        continue-on-error: true
      - run: npm run android:permissions
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: portals-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk portals.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest portals.apk --title "Portals – latest test build" --notes "Built from ${GITHUB_SHA::7}. Install on Android: open the file and allow installs from this source." --latest
